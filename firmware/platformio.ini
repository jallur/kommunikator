; M5StickC Plus2: ESP32-PICO-V3-02. Official PlatformIO snippet uses board m5stick-c
; and espressif32 6.7.0 (Arduino 2.0.16). The Plus2 has 8 MB flash; the
; m5stick-c board profile is 4 MB, which is enough for this sketch.
; https://docs.m5stack.com/en/core/StickC-Plus2

[env:m5stick-c-plus2]
platform = espressif32@6.7.0
board = m5stick-c
framework = arduino
upload_speed = 1500000
monitor_speed = 115200
extra_scripts = pre:patch_websockets.py
build_src_filter = +<*> -<airpods_test.cpp>
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
lib_deps =
    m5stack/M5Unified@0.2.5
    links2004/WebSockets@2.6.1
    bblanchon/ArduinoJson@7.2.1

; Separate sketch: pair AirPods and play a tone. Replaces the voice firmware
; until m5stick-c-plus2 is uploaded again. Huge app partition because the
; Bluetooth stack does not fit beside the voice sketch.
[env:airpods-test]
platform = espressif32@6.7.0
board = m5stick-c
framework = arduino
upload_speed = 1500000
monitor_speed = 115200
board_build.partitions = huge_app.csv
build_src_filter = +<airpods_test.cpp>
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    m5stack/M5Unified@0.2.5
    https://github.com/pschatzmann/ESP32-A2DP.git#v1.8.4

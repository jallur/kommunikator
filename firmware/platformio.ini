; M5StickC Plus2: ESP32-PICO-V3-02. Official PlatformIO snippet uses board m5stick-c
; and espressif32 6.7.0 (Arduino 2.0.16). The Plus2 has 8 MB flash; the
; m5stick-c board profile is 4 MB, which is enough for this sketch.
; https://docs.m5stack.com/en/core/StickC-Plus2

[env:m5stick-c-plus2]
platform = espressif32@6.7.0
board = m5stick-c
framework = arduino
upload_speed = 1500000
monitor_speed = 115200
extra_scripts = pre:patch_websockets.py
; The voice sketch alone fills the 1.25 MB default app slot. huge_app is the
; 3 MB slot, so classic A2DP fits beside Wi-Fi and TLS. NVS stays at 0x9000.
board_build.partitions = huge_app.csv
build_src_filter = +<*> -<airpods_test.cpp>
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DWEBSOCKETS_TCP_TIMEOUT=5000
lib_deps =
    m5stack/M5Unified@0.2.5
    links2004/WebSockets@2.6.1
    bblanchon/ArduinoJson@7.2.1
    https://github.com/pschatzmann/ESP32-A2DP.git#v1.8.4

; Tone-only sketch. Same pairing path, no relay. Useful when the combined
; image is not what should be on the stick.
[env:airpods-test]
platform = espressif32@6.7.0
board = m5stick-c
framework = arduino
upload_speed = 1500000
monitor_speed = 115200
board_build.partitions = huge_app.csv
build_src_filter = +<airpods_test.cpp>
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    m5stack/M5Unified@0.2.5
    https://github.com/pschatzmann/ESP32-A2DP.git#v1.8.4

; ESP32-S3 boards. Compile seam for the next devices. Plus2 stays the
; floor: these profiles have no classic A2DP, capture at 16 kHz and ask
; the relay for 24 kHz. Pins come from M5Unified once the board id is
; known. qio_opi is quad flash plus octal PSRAM (N8R8 / CoreS3).
[env:m5sticks3]
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1
framework = arduino
upload_speed = 1500000
monitor_speed = 115200
extra_scripts = pre:patch_websockets.py
board_build.arduino.memory_type = qio_opi
build_src_filter = +<*> -<airpods_test.cpp>
build_flags =
    -DBOARD_HAS_PSRAM
    -DKOMM_BOARD_STICKS3
    -DKOMM_A2DP=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DWEBSOCKETS_TCP_TIMEOUT=400
lib_deps =
    m5stack/M5Unified@0.2.5
    links2004/WebSockets@2.6.1
    bblanchon/ArduinoJson@7.2.1

[env:cores3-lite]
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1
framework = arduino
upload_speed = 1500000
monitor_speed = 115200
extra_scripts = pre:patch_websockets.py
board_build.arduino.memory_type = qio_opi
build_src_filter = +<*> -<airpods_test.cpp>
build_flags =
    -DBOARD_HAS_PSRAM
    -DKOMM_BOARD_CORES3_LITE
    -DKOMM_A2DP=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DWEBSOCKETS_TCP_TIMEOUT=400
lib_deps =
    m5stack/M5Unified@0.2.5
    links2004/WebSockets@2.6.1
    bblanchon/ArduinoJson@7.2.1

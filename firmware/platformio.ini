; M5StickC Plus2: ESP32-PICO-V3-02. Official PlatformIO snippet uses board m5stick-c
; and espressif32 6.7.0 (Arduino 2.0.16). The Plus2 has 8 MB flash; the
; m5stick-c board profile is 4 MB, which is enough for this sketch.
; https://docs.m5stack.com/en/core/StickC-Plus2

[env:m5stick-c-plus2]
platform = espressif32@6.7.0
board = m5stick-c
framework = arduino
upload_speed = 1500000
monitor_speed = 115200
extra_scripts = pre:patch_websockets.py
; The voice sketch alone fills the 1.25 MB default app slot. huge_app is the
; 3 MB slot, so classic A2DP fits beside Wi-Fi and TLS. NVS stays at 0x9000.
board_build.partitions = huge_app.csv
build_src_filter = +<*> -<airpods_test.cpp>
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DWEBSOCKETS_TCP_TIMEOUT=5000
lib_deps =
    m5stack/M5Unified@0.2.5
    links2004/WebSockets@2.6.1
    bblanchon/ArduinoJson@7.2.1
    https://github.com/pschatzmann/ESP32-A2DP.git#v1.8.4

; Tone-only sketch. Same pairing path, no relay. Useful when the combined
; image is not what should be on the stick.
[env:airpods-test]
platform = espressif32@6.7.0
board = m5stick-c
framework = arduino
upload_speed = 1500000
monitor_speed = 115200
board_build.partitions = huge_app.csv
build_src_filter = +<airpods_test.cpp>
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    m5stack/M5Unified@0.2.5
    https://github.com/pschatzmann/ESP32-A2DP.git#v1.8.4

; ESP32-S3 boards. Plus2 stays the floor: these profiles have no classic
; A2DP, capture at 16 kHz and ask the relay for 24 kHz. Pins come from
; M5Unified once the board id is known.
; StickS3 is N8R8, so qio_opi (quad flash, octal PSRAM).
; CoreS3 / CoreS3-SE / CoreS3 Lite are 16 MB flash and 8 MB quad PSRAM
; on Arduino-ESP32 2.0.16 (espressif32 6.7.0): memory type qio_qspi.
; One firmware covers SE and Lite. SE has no GC0308; the camera button
; reports that instead of taking a picture.
[env:m5sticks3]
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1
framework = arduino
upload_speed = 1500000
monitor_speed = 115200
extra_scripts = pre:patch_websockets.py
board_build.arduino.memory_type = qio_opi
build_src_filter = +<*> -<airpods_test.cpp>
build_flags =
    -DBOARD_HAS_PSRAM
    -DKOMM_BOARD_STICKS3
    -DKOMM_A2DP=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DWEBSOCKETS_TCP_TIMEOUT=400
lib_deps =
    m5stack/M5Unified@0.2.5
    links2004/WebSockets@2.6.1
    bblanchon/ArduinoJson@7.2.1

[env:cores3]
platform = espressif32@6.7.0
board = m5stack-cores3
framework = arduino
; Native USB on macOS drops the link when the flasher stub takes over
; ("Unable to verify flash chip connection" right after "Stub running").
; Stay on the ROM loader, at the ROM baud, so that handoff never happens.
upload_speed = 115200
upload_flags =
    --no-stub
monitor_speed = 115200
extra_scripts = pre:patch_websockets.py
board_build.arduino.memory_type = qio_qspi
; huge_app is the 3 MB slot. The camera driver does not fit the 1.25 MB
; default app partition. NVS stays at 0x9000.
board_build.partitions = huge_app.csv
build_src_filter = +<*> -<airpods_test.cpp>
build_flags =
    -DBOARD_HAS_PSRAM
    -DKOMM_BOARD_CORES3
    -DKOMM_A2DP=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DWEBSOCKETS_TCP_TIMEOUT=400
lib_deps =
    m5stack/M5Unified@0.2.5
    links2004/WebSockets@2.6.1
    bblanchon/ArduinoJson@7.2.1

; Old name. Same image as cores3, so a Lite and an SE both flash this.
[env:cores3-lite]
extends = env:cores3
build_flags =
    ${env:cores3.build_flags}
    -DKOMM_BOARD_CORES3_LITE

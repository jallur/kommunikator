# Run on the Mac Mini (Docker). cloud01 is the fallback.
# Public name: trek.aldenback.com. TLS terminates in front of this container.
# Do not run this on Jonas's workstation.
# The process itself speaks plain HTTP on 8080 inside the host network.

services:
  relay:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
